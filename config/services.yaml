services:
    _defaults:
        autowire: true
        autoconfigure: true
        bind:
            $normalizationConfig: '%pimcore_comparison.normalization%'
            $excludedFields: '%pimcore_comparison.excluded_fields%'
            $defaultFilter: '%pimcore_comparison.default_filter%'
            $exportFormats: '%pimcore_comparison.export.formats%'

    # Auto-register every service class under src/, excluding interfaces/abstracts (auto-skipped) and
    # the pure value objects / config holders (non-autowirable constructors).
    Pimcore\Bundle\ComparisonBundle\:
        resource: '../src/*'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Dto/'
            - '../src/Diff/'
            - '../src/Security/ComparisonPermissions.php'
            - '../src/Controller/'
            - '../src/Comparison/DiffResult.php'
            - '../src/Comparison/WalkedField.php'
            - '../src/Comparison/ComparisonException.php'
            - '../src/Comparator/ComparisonContext.php'
            - '../src/Studio/WebpackEntryPointProvider.php'
            # Feature registry: attributes, enum and value objects are not services; the compiler pass
            # runs at build time. FeatureRegistry, the marker and the commands stay as services.
            - '../src/Feature/Attribute/'
            - '../src/Feature/FeatureStatus.php'
            - '../src/Feature/Coverage/CoverageReport.php'
            - '../src/Feature/DependencyInjection/'

    # Controllers: explicit service args so #[MapQueryString]/#[MapRequestPayload] resolve, and so the
    # broad ../src/* prototype above does not re-register them without the controller tag.
    Pimcore\Bundle\ComparisonBundle\Controller\:
        resource: '../src/Controller/'
        tags: ['controller.service_arguments']

    # Installer must be public so the bundle manager can fetch it.
    Pimcore\Bundle\ComparisonBundle\Installer:
        public: true

    # Studio UI plugin entry point. Declared explicitly (and excluded from the ../src/* prototype
    # above) so the module-federation remote gets registered with the Studio shell via the tag.
    Pimcore\Bundle\ComparisonBundle\Studio\WebpackEntryPointProvider:
        tags:
            - { name: pimcore_studio_ui.webpack_entry_point_provider }
